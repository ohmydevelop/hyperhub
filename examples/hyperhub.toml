schema_version = 2
environment_variables = []

[gateway]
mode = "enforce"
debug = false

[gateway.listener]
socks_address = "127.0.0.1:18444"
pending_session_ttl_seconds = 60

[[gateway.credentials]]
id = "github-api-pat"
type = "http_bearer"
secret = { value = "replace-with-github-api-token" }

[[gateway.credentials]]
id = "github-git-pat"
type = "http_basic"
username = "x-access-token"
password = { value = "replace-with-github-git-token" }

[gateway.audit.settings]
retention_days = 7
connections = true
header_allowlist = []

[[gateway.audit.profiles]]
id = "metadata-only"
protocols = ["http", "ws", "git", "ssh"]
[gateway.audit.profiles.capture]
http_body = false
body_limit_bytes = 1048576
git_transcript = false
ssh_transcript = false
websocket = "off"
[gateway.audit.profiles.capture.directions]
client_upload = true
server_response = true

[gateway.routing.default]
enabled = true
[gateway.routing.default.decision]
action = "allow"

[[gateway.routing.routes]]
id = "github-api-https"
enabled = true
priority = 300
endpoints = [{ target = "api.github.com", port = 443 }]
[gateway.routing.routes.decision]
action = "allow"
credentials = ["github-api-pat"]
audit_profiles = ["metadata-only"]

[[gateway.routing.routes]]
id = "github-https"
enabled = true
priority = 200
endpoints = [{ target = "github.com", port = 443 }]
[gateway.routing.routes.decision]
action = "allow"
credentials = ["github-git-pat"]
audit_profiles = ["metadata-only"]

[gateway.trust]
tls_certificates = []
ssh_host_keys = []

[sandbox.network]
enabled = false
default_action = "allow"
error_action = "allow"
rules = []

[sandbox.file]
enabled = false
default_action = "allow"
error_action = "allow"
rules = []

[sandbox.process]
enabled = false
default_action = "allow"
error_action = "allow"
rules = []
