[package]
name = "hyperhub-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "hyperhub_engine"
crate-type = ["rlib", "cdylib"]

[dependencies]
hmac = "0.12"
rand = "0.10"
regex = "1"
ipnet = { version = "2", features = ["serde"] }
hyperhub-runtime = { path = "../hyperhub-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
libloading = "0.8"
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
