name: ci

on:
  push:
    branches:
      - main
      - master
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Check isolated CI permission setup
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p test_ci_linux_gum_environment.py

      - name: Prepare unrestricted Gum environment in disposable test VM
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-gum-environment.sh prepare

      - name: Prepare Linux Frida devkits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t devkits < <(./scripts/frida-devkit.sh x86_64)
          echo "HYPERHUB_FRIDA_GUM_ROOT=${devkits[0]}" >> "$GITHUB_ENV"
          echo "HYPERHUB_FRIDA_CORE_ROOT=${devkits[1]}" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I${devkits[1]}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Check HyperHub Skill benchmark contract
        run: ./scripts/benchmark-skill-subagent.sh --contract-only

      - name: Test release readiness and installer isolation
        run: python scripts/test-development-release.py

      - name: Test isolated HyperHub homes
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p hyperhub --locked
          ./scripts/test-cli-multi-home.sh ./target/release/hyperhub
          python3 scripts/test-development-release.py --hyperhub ./target/release/hyperhub

      - name: Test Linux Gum Agent
        if: runner.os == 'Linux'
        run: cargo test -p hyperhub-agent-core --features gum-agent --locked

      - name: Build Windows embedded CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build.ps1 -SkipTests
          .\scripts\test-development-install.ps1

      - name: Test Windows Hook semantics
        timeout-minutes: 30
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-windows-hooks.ps1

      - name: Upload Windows Hook evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-hook-regressions
          path: target/benchmarks/windows-hooks/*
          if-no-files-found: warn

      - name: Restore test VM permission policy
        if: always() && runner.os == 'Linux'
        run: bash scripts/ci-linux-gum-environment.sh restore

  linux-targets:
    name: Check Linux targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang gcc-aarch64-linux-gnu libclang-dev musl-tools busybox-static openssh-server openssl

      - name: Prepare unrestricted Gum environment in disposable test VM
        run: bash scripts/ci-linux-gum-environment.sh prepare

      - name: Check targets and fixtures
        run: ./scripts/test-platform.sh

      - name: Benchmark smart protection matrix
        run: python3 scripts/benchmark-smart-protection.py --output target/benchmarks/smart-protection

      - name: Upload smart protection benchmark
        uses: actions/upload-artifact@v4
        with:
          name: smart-protection-benchmark
          path: target/benchmarks/smart-protection/*
          if-no-files-found: error

      - name: Upload static benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: linux-static-benchmark
          path: |
            target/benchmarks/linux-backends/checks.tsv
            target/benchmarks/linux-backends/results.csv
            target/benchmarks/linux-backends/summary.csv
            target/benchmarks/linux-backends/report.md
            target/benchmarks/linux-backends/suite.json
            target/benchmarks/linux-backends/suite-report.md
            target/benchmarks/linux-backends/hooks.json
            target/benchmarks/linux-backends/dynamic-hooks.json
            target/benchmarks/linux-fixtures/*/manifest.json
          if-no-files-found: error

      - name: Restore test VM permission policy
        if: always()
        run: bash scripts/ci-linux-gum-environment.sh restore

  attachment-linux-soak:
    name: Attachment soak (Linux ${{ matrix.backend }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/') && contains(github.event.head_commit.message, '[attach soak]'))
    needs: [rust, linux-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        backend: [ptrace, gum]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Prepare unrestricted Gum environment in disposable test VM
        if: matrix.backend == 'gum'
        run: bash scripts/ci-linux-gum-environment.sh prepare
      - name: Build embedded candidate
        run: bash scripts/build.sh
      - name: Exercise attachment lifecycle for two hours
        run: |
          python3 scripts/test-dynamic-attach.py \
            --hyperhub target/release/hyperhub --backend '${{ matrix.backend }}' \
            --origin attach --target-pty --cycles 100 --duration 7200 \
            --output target/benchmarks/attachment-soak/${{ matrix.backend }}
      - name: Exercise reversible run lifecycle
        run: |
          python3 scripts/test-dynamic-attach.py \
            --hyperhub target/release/hyperhub --backend '${{ matrix.backend }}' \
            --origin run --target-pty --cycles 3 \
            --output target/benchmarks/attachment-run/${{ matrix.backend }}
      - name: Upload bounded attachment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-soak-linux-${{ matrix.backend }}
          path: |
            target/benchmarks/attachment-soak/${{ matrix.backend }}/result.json
            target/benchmarks/attachment-soak/${{ matrix.backend }}/failure.json
            target/benchmarks/attachment-run/${{ matrix.backend }}/result.json
            target/benchmarks/attachment-run/${{ matrix.backend }}/failure.json
          if-no-files-found: warn

      - name: Restore test VM permission policy
        if: always() && matrix.backend == 'gum'
        run: bash scripts/ci-linux-gum-environment.sh restore

  attachment-windows-soak:
    name: Attachment soak (Windows gum)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/') && contains(github.event.head_commit.message, '[attach soak]'))
    needs: [rust, linux-targets]
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded candidate
        shell: pwsh
        run: .\scripts\build.ps1 -SkipTests
      - name: Exercise attachment lifecycle for two hours
        shell: pwsh
        run: |
          python scripts/test-dynamic-attach-windows.py --hyperhub target/release/hyperhub.exe --origin attach --cycles 100 --duration 7200 --output target/benchmarks/attachment-soak/gum
          if ($LASTEXITCODE -ne 0) { throw 'Windows attachment soak failed' }
      - name: Exercise reversible run lifecycle
        shell: pwsh
        run: |
          python scripts/test-dynamic-attach-windows.py --hyperhub target/release/hyperhub.exe --origin run --cycles 3 --output target/benchmarks/attachment-run/gum
          if ($LASTEXITCODE -ne 0) { throw 'Windows reversible run failed' }
      - name: Upload bounded attachment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-soak-windows-gum
          path: |
            target/benchmarks/attachment-soak/gum/result.json
            target/benchmarks/attachment-soak/gum/failure.json
            target/benchmarks/attachment-run/gum/result.json
            target/benchmarks/attachment-run/gum/failure.json
          if-no-files-found: warn
