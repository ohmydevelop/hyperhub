name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        default: "0.2.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu libclang-dev

      - name: Build and package Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          bash scripts/release-linux.sh "${{ matrix.arch }}"
          binary="target/${{ matrix.target }}/release/hyperhub"
          test -x "$binary"

          package_name="hyperhub-linux-${{ matrix.arch }}"
          package_dir="dist/$package_name"
          archive="dist/$package_name.tar.gz"
          rm -rf "$package_dir" "$archive"
          mkdir -p "$package_dir"
          install -m 0755 "$binary" "$package_dir/hyperhub"
          cp README.md LICENSE third_party/frida-gum/COPYING \
            "$package_dir/"
          cp third_party/needle/LICENSE "$package_dir/LICENSE-NEEDLE.txt"
          cp third_party/needle/README.md "$package_dir/NOTICE-NEEDLE.md"
          mv "$package_dir/COPYING" "$package_dir/LICENSE-FRIDA-GUM.txt"
          (cd "$package_dir" && sha256sum * > MANIFEST.sha256)
          tar -czf "$archive" -C dist "$package_name"

      - name: Build and package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          .\scripts\release.ps1 -Version $version -SkipTests
          $versioned = Join-Path (Join-Path (Get-Location) 'dist') "hyperhub-v$version-windows-x64.zip"
          $stable = Join-Path (Join-Path (Get-Location) 'dist') 'hyperhub-windows-x64.zip'
          Copy-Item -Force -LiteralPath $versioned -Destination $stable
          Remove-Item -Force -LiteralPath $versioned

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperhub-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
            scripts/install.sh
            scripts/install.ps1
